<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5Joys Corporation | Bee-to-Bee Operations</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="left-panel">
        <div class="overlay">
           <img src="images/b2blogo.png" alt="Bee-to-Bee Logo" class="logo">
            <h1>Bee-to-Bee Operations</h1>
            <p class="description">
                A Cross-Functional Franchise Launch and Operations Transaction Processing System for
                <strong>5Joys Corporation.</strong>
            </p>
            <div class="features">
                <div class="feature">✓ Smart Site Qualification</div>
                <div class="feature">✓ Approval Workflow</div>
                <div class="feature">✓ Recruitment &amp; Training</div>
                <div class="feature">✓ Store Launch Readiness</div>
                <div class="feature">✓ Operations Monitoring</div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Sign in to your account.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="example@5joys.com" required>

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input id="password" type="password" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <p class="login-message" id="loginMessage" aria-live="polite"></p>
                <button type="submit">Sign in with email</button>
            </form>
            <div class="login-divider" aria-hidden="true"><span>or</span></div>
            <button type="button" id="googleSignIn" class="google-sign-in">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M21.35 12.21c0-.68-.06-1.18-.19-1.7H12v3.31h5.37a4.6 4.6 0 0 1-2 3.02v2.5h3.22c1.88-1.73 2.76-4.28 2.76-7.13Z"/><path fill="#34A853" d="M12 21.5c2.69 0 4.95-.89 6.59-2.41l-3.22-2.5c-.89.6-2.03.96-3.37.96-2.6 0-4.81-1.76-5.6-4.12H3.08v2.58A9.5 9.5 0 0 0 12 21.5Z"/><path fill="#FBBC05" d="M6.4 13.43a5.7 5.7 0 0 1 0-3.65V7.2H3.08a9.5 9.5 0 0 0 0 8.81l3.32-2.58Z"/><path fill="#EA4335" d="M12 5.65c1.46 0 2.76.5 3.79 1.48l2.84-2.84A9.16 9.16 0 0 0 12 2.5 9.5 9.5 0 0 0 3.08 7.2L6.4 9.78c.79-2.36 3-4.13 5.6-4.13Z"/></svg>
                Continue with Google
            </button>
        </div>
    </div>
</div>

<script type="module" src="js/login.js?v=20261112-1"></script>
<script>
const pwInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");

const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
const eyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

toggleBtn.addEventListener("click", () => {
  const show = pwInput.type === "password";
  pwInput.type = show ? "text" : "password";
  eyeIcon.innerHTML = show ? eyeOff : eyeOpen;
  toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
});
</script>
</body>
</html>
