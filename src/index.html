<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5Joys Corporation | Bee-to-Bee Operations</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="left-panel">
        <div class="overlay">
           <img src="images/b2blogo.png" alt="Bee-to-Bee Logo" class="logo">
            <h1>Bee-to-Bee Operations</h1>
            <p class="description">
                A Cross-Functional Franchise Launch and Operations Transaction Processing System for
                <strong>5Joys Corporation.</strong>
            </p>
            <div class="features">
                <div class="feature">✓ Smart Site Qualification</div>
                <div class="feature">✓ Approval Workflow</div>
                <div class="feature">✓ Recruitment &amp; Training</div>
                <div class="feature">✓ Store Launch Readiness</div>
                <div class="feature">✓ Operations Monitoring</div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Sign in to your account.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="example@5joys.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" required>

                

                <p class="login-message" id="loginMessage" aria-live="polite"></p>
                <button type="submit">LOGIN</button>
            </form>
        </div>
    </div>
</div>
<script src="js/login.js?v=20260804"></script>
<script>
const USERS={
"sophia.ramirez@5joys.com":{name:"Sophia Ramirez",role:"Business Development",page:"business-development.html"},"carlos.reyes@5joys.com":{name:"Carlos Reyes",role:"Operations Head",page:"operations-head.html"},"angela.santos@5joys.com":{name:"Angela Santos",role:"HR Specialist",page:"hr-specialist.html"},"michael.dela.cruz@5joys.com":{name:"Michael Dela Cruz",role:"Store Trainer",page:"store-trainer.html"},"ruth.reyes@5joys.com":{name:"Ruth Reyes",role:"Store Manager",page:"store-manager.html"},"joel.navarro@5joys.com":{name:"Joel Navarro",role:"Supply Chain Officer",page:"supply-chain.html"},"bea.hernandez@5joys.com":{name:"Bea Hernandez",role:"Area Manager",page:"area-manager.html"},"ruth.torres@5joys.com":{name:"Ruth Torres",role:"Store Manager",page:"store-manager.html"},"engr.nina.cruz@5joys.com":{name:"Engr. Nina Cruz",role:"Engineering Head",page:"engineering-head.html"},"maria.santos@5joys.com":{name:"Maria Santos",role:"Executive Management",page:"executive-management.html"},"carlo.lim@5joys.com":{name:"Carlo Lim",role:"Finance Head",page:"finance-head.html"},"atty.maya.santos@5joys.com":{name:"Atty. Maya Santos",role:"Legal Head",page:"legal-head.html"}
};
document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('form');if(!f)return;let msg=document.createElement('p');msg.id='loginMessage';msg.style.color='#E31937';f.appendChild(msg);f.addEventListener('submit',e=>{e.preventDefault();const email=document.querySelector('input[type=email]').value.trim().toLowerCase();const u=USERS[email];if(!u){msg.textContent='Unauthorized User';return;}localStorage.setItem('loggedInUser',JSON.stringify({email:email,name:u.name,role:u.role}));location.href=u.page;});});
</script></body>
</html>
